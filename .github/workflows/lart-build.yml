name: Lart build

# Builds every Lart package: the Android APK and the Windows, macOS and Linux
# installers. It runs on pull requests and by hand from the Actions tab; a pushed
# v* tag also publishes the packages to a GitHub release for that tag.
#
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway key made for that run, so it
# installs but cannot update an APK from another run.

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # The extension compat layer needs jars that are not on Maven Central
  # (android-extension-compat/tools/deps.sh), so CI builds without extension
  # support: point the stage at no layer and declare that deliberately.
  HARBOR_CAPSTAN_SRC: ${{ github.workspace }}/.no-capstan-layer
  HARBOR_CAPSTAN_OPTIONAL: "1"

concurrency:
  group: lart-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK and its command-line tools.
      - name: Install Android platform and NDK
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The Pokémon engine is a desktop .NET binary that cannot run on Android.
      # tauri.conf.json still names its directory, and the bundler accepts an
      # empty one but not a missing one.
      - name: Prepare resources
        run: mkdir -p src-tauri/resources/pokemon-engine

      - name: Configure release signing
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and cannot update an installed Lart signed with another key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/lart-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign with a throwaway key
        if: steps.sign.outputs.signed != 'true'
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -print -quit)"
          test -n "$apk"
          keystore="$RUNNER_TEMP/throwaway.jks"
          keytool -genkeypair -keystore "$keystore" -storepass lartci -keypass lartci \
            -alias lart -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Lart CI"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keystore" \
            --ks-pass pass:lartci --key-pass pass:lartci \
            --out "${apk%-unsigned.apk}.apk" "$apk"
          rm "$apk"

      - name: Name the APK
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' -print -quit)"
          test -n "$apk"
          mkdir -p dist-android
          cp "$apk" "dist-android/Lart_${version}_arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lart-android
          path: dist-android/*.apk
          retention-days: 14
          if-no-files-found: error

  desktop:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS-AppleSilicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            xdg-utils \
            xz-utils

      - name: Install macOS build dependencies
        if: contains(matrix.platform.runner, 'macos')
        run: |
          brew install mpv pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Pokémon engine SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Build Pokémon engine and corresponding source bundle
        run: node tools/pokemon-engine/build.mjs --fetch-source "${{ runner.temp }}/harbor-pokemon-source" --output src-tauri/resources/pokemon-engine --artifacts "${{ runner.temp }}/harbor-pokemon-build"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Harbor's pinned libmpv-2.dll release is gone. Take the DLL from the mpv-dev
      # package of the shinchiro release that fetch-mpv.mjs already uses for mpv.exe,
      # and log its digest so each build records what it shipped.
      - name: Fetch libmpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=shinchiro/mpv-winbuild-cmake
          tag=20260610
          gh release view "$tag" -R "$repo" > /dev/null 2>&1 || tag=$(gh release view -R "$repo" --json tagName --jq .tagName)
          assets=$(gh release view "$tag" -R "$repo" --json assets --jq '.assets[].name')
          echo "$repo $tag assets:"; echo "$assets"
          asset=$(echo "$assets" | grep -E '^mpv-dev-x86_64-[0-9].*\.7z$' | head -1 || true)
          [ -n "$asset" ] || asset=$(echo "$assets" | grep -E '^mpv-dev-x86_64.*\.7z$' | head -1 || true)
          test -n "$asset"
          gh release download "$tag" -R "$repo" -p "$asset" -O "$RUNNER_TEMP/mpv-dev.7z"
          7z e -y "$RUNNER_TEMP/mpv-dev.7z" -o"src-tauri/libmpv" libmpv-2.dll -r
          sha256sum "$RUNNER_TEMP/mpv-dev.7z" src-tauri/libmpv/libmpv-2.dll
          # fetch-mpv.mjs pins mpv.exe to 20260610; when that release is gone, take
          # mpv.exe from the same release as the DLL (fetch-mpv skips a present file).
          if [ "$tag" != 20260610 ]; then
            player=$(echo "$assets" | grep -E '^mpv-x86_64-[0-9].*\.7z$' | head -1 || true)
            test -n "$player"
            gh release download "$tag" -R "$repo" -p "$player" -O "$RUNNER_TEMP/mpv.7z"
            7z e -y "$RUNNER_TEMP/mpv.7z" -o"$RUNNER_TEMP/mpv" mpv.exe -r
            mkdir -p src-tauri/binaries
            cp "$RUNNER_TEMP/mpv/mpv.exe" src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe
            sha256sum "$RUNNER_TEMP/mpv.7z" src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe
          fi

      # setup:libmpv only knows Harbor's retired download, so it is left out.
      - name: Prepare build assets
        run: |
          pnpm run setup:binaries
          pnpm run setup:mpv
          pnpm run setup:fonts
          pnpm run setup:capstan

      - name: Prepare bundled macOS libraries
        if: contains(matrix.platform.runner, 'macos')
        id: macos-libraries
        shell: bash
        run: |
          FRAMEWORKS_DIR="$RUNNER_TEMP/lart-macos-frameworks"
          CONFIG_PATH="$RUNNER_TEMP/tauri-macos-libmpv.json"
          python3 scripts/macos-bundle-libmpv.py prepare \
            --frameworks "$FRAMEWORKS_DIR" \
            --config "$CONFIG_PATH" \
            --target "${{ matrix.platform.target }}"
          echo "HARBOR_MACOS_FRAMEWORKS_DIR=$FRAMEWORKS_DIR" >> "$GITHUB_ENV"
          echo "config=--config $CONFIG_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer
        if: contains(matrix.platform.runner, 'windows')
        run: pnpm tauri build --target ${{ matrix.platform.target }} --bundles nsis

      - name: Build macOS app
        if: contains(matrix.platform.runner, 'macos')
        run: pnpm tauri build --target ${{ matrix.platform.target }} --bundles app,dmg ${{ steps.macos-libraries.outputs.config }}

      - name: Build Linux packages
        if: contains(matrix.platform.runner, 'ubuntu')
        run: pnpm tauri:build:linux-system --target ${{ matrix.platform.target }} --bundles deb,appimage

      - name: Verify macOS app
        if: contains(matrix.platform.runner, 'macos')
        shell: bash
        run: |
          APP_PATH="$(find "src-tauri/target/${{ matrix.platform.target }}/release/bundle" -type d -name 'Lart.app' -print -quit)"
          test -n "$APP_PATH"
          python3 scripts/macos-bundle-libmpv.py verify-app --app "$APP_PATH" --target "${{ matrix.platform.target }}"
          python3 scripts/macos-startup-check.py --app "$APP_PATH" --output "$RUNNER_TEMP/lart-macos-startup" --seconds 20

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: lart-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, desktop]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: lart-*
          path: packages
          merge-multiple: true

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
